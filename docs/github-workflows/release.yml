name: Release
on:
  push: { tags: ["v*"] }
permissions: { contents: write }
jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/package.sh
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Chitter-*.dmg
            dist/Chitter-*.zip
            dist/checksums.txt
